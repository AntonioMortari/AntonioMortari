# Salve este arquivo em: .github/workflows/update-stats.yml
# Gera os cards de estatísticas dentro do próprio repositório (não depende do Vercel).
name: Atualizar cards do README

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00:00 (horário de Brasília)
  workflow_dispatch:     # permite rodar manualmente na aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&hide_border=true&locale=pt-br&title_color=38BAD6&icon_color=6B0DF5&text_color=c9d1d9&bg_color=0d1117&ring_color=6B0DF5
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&locale=pt-br&title_color=38BAD6&text_color=c9d1d9&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit dos cards de stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza cards do README" || echo "Nada para commitar"
          git push

      # Gráfico de contribuições + horário produtivo (substitui o activity-graph da Vercel)
      - name: Cards de perfil e contribuições
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "America/Sao_Paulo"
          THEME: "tokyonight"
          AUTO_PUSH: true
